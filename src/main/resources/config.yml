# ==========================================
#        AdvancedWelcome Configuration
# ==========================================

messages:

  # Zprava, kterou vidi vsichni pri pripojeni hrace
  join: "<gray>[<green>+</green>] <yellow>%player%</yellow> <gray>se pripojil na server!"

  # Zprava pri prvnim pripojeni hrace
  first-join: "<gold>★ <yellow>%player%</yellow> <white>je na serveru poprve! <gold>★"

  # Soukroma zprava pro hrace po pripojeni
  welcome: "<green>Vitej na serveru, <yellow>%player%</yellow><green>! Prejeme prijemnou hru."

  # Zprava pri odpojeni
  quit: "<gray>[<red>-</red>] <yellow>%player%</yellow> <gray>se odpojil ze serveru."


# ==========================================
#                  TITLE
# ==========================================

title:

  # true = title zapnuty
  # false = title vypnuty
  enabled: true

  title: "<gradient:#ff9900:#ffff00><bold>VITEJ!</bold></gradient>"

  subtitle: "<gray>Ahoj, <yellow>%player%</yellow><gray>!"

  # Cas je v milisekundach
  fade-in: 500
  stay: 3000
  fade-out: 1000


# ==========================================
#                  SOUND
# ==========================================

sound:

  enabled: true

  # Minecraft sound
  name: "ENTITY_PLAYER_LEVELUP"

  volume: 1.0

  pitch: 1.0
